<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>Tidak ada koneksi — Cashflow</title>
    <style>
      :root {
        --bg: #09090b;
        --surface: #18181b;
        --ink: #fafafa;
        --mute: #71717a;
        --accent: #f59e0b;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 360px;
        background: var(--surface);
        border: 1px solid #27272a;
        border-radius: 20px;
        padding: 32px 24px;
      }
      .mark {
        width: 56px; height: 56px;
        margin: 0 auto 18px;
        border-radius: 14px;
        background: #18181b;
        display: grid; place-items: center;
      }
      .mark svg { width: 30px; height: 30px; }
      h1 { font-size: 18px; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { font-size: 14px; line-height: 1.5; color: var(--mute); margin: 0; }
      .dot {
        display: inline-block; width: 8px; height: 8px; border-radius: 999px;
        background: var(--accent); margin-bottom: 18px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v18" />
          <path d="m6 9 6-6 6 6" />
          <path d="m6 15 6 6 6-6" />
        </svg>
      </div>
      <span class="dot"></span>
      <h1>Tidak ada koneksi internet</h1>
      <p>Perangkat Anda sedang offline. Silakan periksa koneksi Anda dan coba lagi — data yang sudah tersimpan tetap bisa dibuka.</p>
    </div>
  </body>
</html>
